name: Build APK for Android (TodoAppBasic1.2)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK con Flet
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el repositorio
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Configurar Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Configurar Java JDK 17
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 4. Instalar dependencias de Python y Flet
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install flet flet-cli

    # 5. Compilar el APK con Flet (con --yes para aceptar automáticamente sin pausar)
    - name: Build APK with Flet
      run: |
        flet build apk --yes --project "TodoAppBasic1.2" --org "com.todoapp"

    # 6. Subir el APK para descargarlo en Artifacts
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TodoAppBasic1.2-APK
        path: build/apk/*.apk
        retention-days: 30

    # 7. Opcional: Crear Release en GitHub si se crea una etiqueta
    - name: Create Release (on tags)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/apk/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
