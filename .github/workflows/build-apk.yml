name: Build APK for Android (TodoAppBasic1.2)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite compilar manualmente con un clic en GitHub

jobs:
  build:
    name: Compilar APK con Flet
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el repositorio
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Configurar Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Configurar Java JDK 17 (OBLIGATORIO para Android moderno)
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 4. Configurar Flutter SDK (Motor gráfico de Flet)
    - name: Set up Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    # 5. Instalar dependencias de Python y herramientas de Flet
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install flet flet-cli

    # 6. Compilar el APK dentro de la carpeta donde está main.py
    - name: Build APK with Flet
      working-directory: "version1.2-Python(Desktop)"
      run: |
        flet build apk --project "TodoAppBasic1.2" --org "com.todoapp"

    # 7. Subir el APK para descargarlo en Artifacts
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TodoApp-APK
        path: version1.2-Python(Desktop)/build/apk/*.apk
        retention-days: 30

    # 8. Opcional: Crear Release en GitHub si creas una etiqueta (tag)
    - name: Create Release (on tags)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: version1.2-Python(Desktop)/build/apk/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
