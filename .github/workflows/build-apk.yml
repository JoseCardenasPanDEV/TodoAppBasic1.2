name: Build APK for Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet flet-core

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install Flet CLI
      run: |
        pip install flet-cli

    - name: Build APK
      run: |
        flet build apk --include-src

    - name: Upload APK as Release Asset
      uses: actions/upload-artifact@v4
      with:
        name: TodoApp-APK
        path: build/outputs/apk/release/app-release.apk
